<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">JIT versus the optimized register VM, measured together</title>
<desc id="desc">Speedup on a shared linear scale. One times means equal speed. Dashed bars indicate VM fallback. Rounded timings appear alongside each bar.</desc>
