<svg xmlns="http://www.w3.org/2000/svg" width="960" height="302" viewBox="0 0 960 302" role="img" aria-labelledby="title desc">
  <title id="title">Rung's execution paths</title>
  <desc id="desc">A shared frontend feeds the tree-walker, stack bytecode VM and register bytecode VM. Hot register functions compile to ARM64, with guard failures returning to the VM. Every path shares values, closures and garbage collection.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#667b94"/></marker></defs>
  <rect width="960" height="302" rx="16" fill="#f5f8fc"/>
  <g fill="none" stroke="#667b94" stroke-width="2" marker-end="url(#arrow)">
    <path d="M130 123 H177"/>
    <path d="M360 123 H390 V48 H417"/>
    <path d="M360 123 H417"/>
    <path d="M390 123 V198 H417"/>
    <path d="M610 198 H717"/>
    <path d="M820 223 V246 H525 V225" stroke-dasharray="5 4"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#172235">
    <rect x="30" y="98" width="100" height="50" rx="8" fill="#e2eaf5"/>
    <text x="80" y="129" font-size="16">Source</text>
    <rect x="180" y="88" width="180" height="70" rx="8" fill="#e2eaf5"/>
    <text x="270" y="117" font-size="17" font-weight="600">Shared frontend</text>
    <text x="270" y="141" font-size="12">lex · parse · resolve · fold</text>
    <rect x="420" y="23" width="190" height="50" rx="8" fill="#e2eaf5"/>
    <text x="515" y="54" font-size="16">Tree-walker</text>
    <rect x="420" y="98" width="190" height="50" rx="8" fill="#dbeaf4"/>
    <text x="515" y="129" font-size="16">Stack bytecode VM</text>
    <rect x="420" y="173" width="190" height="50" rx="8" fill="#d3eeeb"/>
    <text x="515" y="204" font-size="16">Register bytecode VM</text>
    <rect x="720" y="173" width="200" height="50" rx="8" fill="#e7e0f7"/>
    <text x="820" y="204" font-size="16">ARM64 machine code</text>
    <text x="664" y="184" font-size="12">hot function</text>
    <text x="695" y="266" font-size="12">guard failure → resume in VM</text>
    <text x="238" y="283" font-size="13">Shared values, closures and garbage collector</text>
  </g>
</svg>
