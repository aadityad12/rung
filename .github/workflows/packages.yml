name: packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: ubuntu-24.04
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install tools on macOS
        if: runner.os == 'macOS'
        run: command -v ninja || brew install ninja
      - name: Install tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build python3
      - name: Configure
        shell: bash
        run: |
          extra=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            extra+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=15.0)
          fi
          cmake --preset release-goto-nanbox "${extra[@]}"
      - run: cmake --build --preset release-goto-nanbox
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(./build/release-goto-nanbox/rung --version | head -1)
          test "$version" = "rung ${RELEASE_TAG#v}"
      - run: ctest --preset release-goto-nanbox
      - name: Package and smoke-test the archive
        shell: bash
        run: |
          cpack --config build/release-goto-nanbox/CPackConfig.cmake -B build/packages
          mkdir build/unpacked
          tar -xzf build/packages/rung-*.tar.gz -C build/unpacked
          cd build/unpacked/rung-*
          ./bin/rung --version
          python3 share/rung/scripts/demo.py --rung bin/rung
      - name: Compute checksums
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          for path in Path('build/packages').glob('*.tar.gz'):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              path.with_name(path.name + '.sha256').write_text(f'{digest}  {path.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rung-${{ matrix.platform }}
          path: |
            build/packages/*.tar.gz
            build/packages/*.sha256
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rung-*
          path: packages
          merge-multiple: true
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Rung $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" packages/* --clobber
