name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan, tsan]
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja
        run: command -v ninja || brew install ninja
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan, tsan]
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang cmake ninja-build python3
      # ThreadSanitizer maps shadow memory at fixed addresses and aborts at startup ("unexpected
      # memory mapping") when the kernel randomizes mmap addresses over more bits than the
      # sanitizer expects. This is a known Linux/TSan issue; 28 bits is the value TSan supports.
      - name: Lower mmap ASLR entropy for ThreadSanitizer
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  linux-x86_64-docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t rung .
      - run: docker run --rm rung

  # Coverage-guided fuzzing of the lexer, parser and resolver (issue #12). Linux only: Apple
  # clang has no libFuzzer runtime. Any crash, hang, leak or sanitizer report fails the job and
  # the offending input is uploaded.
  fuzz:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang cmake ninja-build
      - run: cmake --preset fuzz
      - run: cmake --build --preset fuzz
      - run: ctest --preset fuzz
      - name: Fuzz for 60 seconds
        run: fuzz/run_fuzz.sh build/fuzz/rung_fuzz_frontend 60
      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: fuzz-artifacts/
          if-no-files-found: warn
